name: Multi-Job-CI-Pipeline

on: [push]

jobs:
  lint-job:
    name: Code Syntax Check (Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Python Syntax
        run: |
          echo "Checking Python syntax on config.py..."
          python3 -m py_compile config.py
          echo "Syntax check completed with zero errors."

  test-job:
    name: Run Unit Tests
    needs: lint-job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Smoke Test
        run: |
          echo "Running application smoke test..."
          python3 config.py
          echo "All unit/smoke tests passed."

  build-job:
    name: Build Production Package
    needs: test-job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Artifact
        run: |
          echo "Packaging application files..."
          tar -czvf build-artifact.tar.gz config.py index.html README.md
          echo "Build packaging completed successfully."

      - name: Upload Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build-package
          path: build-artifact.tar.gz
          retention-days: 1

  verify-artifact-job:
    name: Download & Verify Artifact
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - name: Download Production Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build-package

      - name: Inspect Downloaded Artifact
        run: |
          echo "Verifying downloaded artifact in clean runner workspace..."
          ls -lh build-artifact.tar.gz
          echo "Extracting contents to verify package integrity..."
          tar -ztvf build-artifact.tar.gz
          echo "Artifact verification successful!"
